name: Build and Publish SoftCenter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # UCG-Fiber 底层 GLIBC 2.31；debian:11 镜像与 archive/snapshot 包版本常年对不齐，
    # 改用仍在官方源维护的 ubuntu:20.04（同为 GLIBC 2.31）。
    container: ubuntu:20.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1

    steps:
    - name: Prepare Container Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        rm -rf /var/lib/apt/lists/*
        printf 'Acquire::Retries "3";\n' > /etc/apt/apt.conf.d/99ci-apt
        apt-get update
        apt-get install -y --no-install-recommends \
          wget gnupg ca-certificates \
          git curl zip unzip \
          zlib1g-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          libc6-dev-arm64-cross
        # .NET 10 Native AOT 需要较新 clang；focal 自带 clang-10 过旧
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-18 main" \
          > /etc/apt/sources.list.d/llvm18.list
        apt-get update
        apt-get install -y --no-install-recommends clang-18
        ln -sf /usr/bin/clang-18 /usr/local/bin/clang
        ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
        clang --version

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine Version Logic
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG_NAME="${{ github.ref_name }}"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "APP_VERSION=${TAG_NAME#v}" >> $GITHUB_ENV
          echo "🚀 Triggered by Git Tag. Building version: $TAG_NAME"
        else
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          LATEST_TAG=${LATEST_TAG:-v1.0.0}
          
          VER_NUM=${LATEST_TAG#v}
          
          IFS='.' read -r -a PARTS <<< "$VER_NUM"
          MAJOR="${PARTS[0]:-1}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          
          NEW_PATCH=$((PATCH + 1))
          APP_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          RELEASE_TAG="v$APP_VERSION"
          
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "🛠️ Triggered manually. Latest tag was $LATEST_TAG. Auto-incremented to: $RELEASE_TAG"
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Dependencies
      run: dotnet restore

    - name: Publish Native AOT (linux-arm64)
      run: |
        dotnet publish -c Release -r linux-arm64 --self-contained true \
        /p:PublishAot=true \
        /p:Version=${{ env.APP_VERSION }} \
        /p:InformationalVersion=${{ env.APP_VERSION }} \
        /p:ObjCopyName=aarch64-linux-gnu-objcopy \
        /p:SysRoot=/usr/aarch64-linux-gnu

    - name: Zip the build
      run: |
        cp -r web bin/Release/net10.0/linux-arm64/publish/ || true
        cd bin/Release/net10.0/linux-arm64/publish/
        zip -r "$GITHUB_WORKSPACE/SoftCenter-${{ env.RELEASE_TAG }}-arm64.zip" \
            SoftCenterManager \
            libe_sqlite3.so \
            web/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        draft: false
        prerelease: false
        files: SoftCenter-${{ env.RELEASE_TAG }}-arm64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}